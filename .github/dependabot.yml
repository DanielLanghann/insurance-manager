version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      ignore:
        # Stay on the Django 5.2 LTS line until the next LTS release
        - dependency-name: "django"
          update-types: [ "version-update:semver-major" ]
